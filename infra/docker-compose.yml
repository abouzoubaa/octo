# Local development stack — plain Postgres+pgvector, Redis, MinIO (S3-compatible).
# Infra-agnostic by design: the same containers run on any cloud, PaaS, or VPS.
name: cci

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cci
      POSTGRES_PASSWORD: cci
      POSTGRES_DB: cci
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cci"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file: [../.env]
    environment:
      CCI_DATABASE_URL: postgresql+psycopg://cci:cci@db:5432/cci
      CCI_REDIS_URL: redis://redis:6379/0
      CCI_S3_ENDPOINT: http://minio:9000
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      minio: {condition: service_started}

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    env_file: [../.env]
    environment:
      CCI_DATABASE_URL: postgresql+psycopg://cci:cci@db:5432/cci
      CCI_REDIS_URL: redis://redis:6379/0
      CCI_S3_ENDPOINT: http://minio:9000
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  web:
    build:
      context: ../apps/web
      dockerfile: ../../infra/Dockerfile.web
    environment:
      PUBLIC_API_BASE: http://api:8000
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
