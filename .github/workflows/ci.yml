name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cci
          POSTGRES_PASSWORD: cci
          POSTGRES_DB: cci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CCI_DATABASE_URL: postgresql+psycopg://cci:cci@localhost:5432/cci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Migrate (Alembic)
        run: alembic -c infra/alembic.ini upgrade head
      - name: Tests (incl. retrieval + eval-gate-style checks)
        run: pytest -q
      - name: Eval gate smoke (offline providers)
        run: |
          cci-ingest create-creator ci "CI" || true
          cci-ingest seed-demo ci
          cci-eval import ci eval/questions.example.yaml
          cci-eval run ci --gate

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
